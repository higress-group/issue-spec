name: Unit Tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-generated-web:
    name: Verify generated web assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: web/package.json
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up pinned npm
        run: |
          npm_package="$(node --print 'require("./web/package.json").packageManager')"
          npm install --global "${npm_package}"

      - name: Verify generated web assets
        run: make verify-generated

  go-test:
    name: Go unit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: issue_spec_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d issue_spec_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run fast test tier (Git-free, budgeted)
        run: make test-fast

      - name: Run full test tier
        run: make test-full

      - name: Run PAT and authorization PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/issue_spec_test?sslmode=disable
        run: >-
          go test -count=1
          ./internal/server/admin
          ./internal/server/auth
          ./internal/server/auth/delegation
          ./internal/server/authz
          ./internal/server/evidence

  linux-bwrap-contract:
    name: Linux bubblewrap contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap

      - name: Allow unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true

      - name: Run real bubblewrap contract (a skip is treated as failure)
        run: |
          set -euo pipefail
          go test -v -count=1 -run '^TestLinuxRealBubblewrapContract$' ./internal/sandbox/ | tee bwrap-contract.out
          if ! grep -q '^--- PASS: TestLinuxRealBubblewrapContract' bwrap-contract.out; then
            echo "::error::real bubblewrap contract did not PASS (absent, skipped, or unsuccessful) — no all-platform false green allowed"
            exit 1
          fi
